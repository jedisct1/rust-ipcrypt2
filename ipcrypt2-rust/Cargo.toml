[package]
name = "ipcrypt2"
version = "0.10.0"
edition = "2021"
license = "ISC"
authors = ["Frank Denis <github@pureftpd.org>"]
homepage = "https://github.com/jedisct1/rust-ipcrypt2"
repository = "https://github.com/jedisct1/rust-ipcrypt2"
documentation = "https://docs.rs/ipcrypt2"
categories = ["cryptography", "wasm", "security"]
keywords = ["ip", "encryption", "obfuscation", "ipcrypt", "prefix-preserving"]
description = "IP address encryption and obfuscation for IPv4 and IPv6, with deterministic, randomized, and prefix-preserving modes. Rust bindings to libipcrypt2."
readme = "README.md"

[dependencies]
rand = "0.10"

[build-dependencies]
cc = "1.4"

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "bench"
harness = false

[profile.release]
codegen-units = 1
incremental = false
panic = "abort"
