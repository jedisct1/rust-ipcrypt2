[package]
name = "ipcrypt-rs"
version = "0.10.0"
edition = "2021"
authors = ["Frank Denis <github@pureftpd.org>"]
description = "IP address encryption and obfuscation in pure Rust for IPv4 and IPv6, with deterministic, randomized, and prefix-preserving modes."
repository = "https://github.com/jedisct1/rust-ipcrypt2"
documentation = "https://docs.rs/ipcrypt-rs"
readme = "README.md"
license = "ISC"
keywords = ["ip", "encryption", "obfuscation", "ipcrypt", "prefix-preserving"]
categories = ["cryptography", "network-programming"]

[features]
default = ["random"]
random = ["dep:rand", "dep:getrandom"]

[dependencies]
aes = { version = "0.9", features = ["hazmat"] }
rand = { version = "0.10", optional = true }
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
ct-codecs = "1.1"

